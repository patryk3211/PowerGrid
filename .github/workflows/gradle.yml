name: Dev builds

on:
  push:
    branches: [ "architectury-1.20.1/dev" ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

    - name: Build Forge with Gradle Wrapper
      run: ./gradlew :forge:build
    - name: Build Fabric with Gradle Wrapper
      run: ./gradlew :fabric:build

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dev-build-jars
        path:
          forge/build/libs/powergrid-mc*-*-*.jar
          !forge/build/libs/powergrid-mc*-*-*-*.jar
          fabric/build/libs/powergrid-mc*-*-*.jar
          !fabric/build/libs/powergrid-mc*-*-*-*.jar
        if-no-files-found: error
        retention-days: 30
