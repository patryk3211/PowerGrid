name: Dev builds

on:
  push:
    branches: [ "architectury-1.20.1/dev" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Build Forge
      uses: burrunan/gradle-cache-action@v3
      with:
        job-id: jdk21
        arguments: :forge:build
    - name: Upload Forge Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: forge-build
        path:
          forge/build/libs/powergrid-mc*-*-????????.jar
        if-no-files-found: error
        retention-days: 30

    - name: Build Fabric
      uses: burrunan/gradle-cache-action@v3
      with:
        job-id: jdk21
        arguments: :fabric:build
    - name: Upload Fabric Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: fabric-build
        path:
          fabric/build/libs/powergrid-mc*-*-????????.jar
        if-no-files-found: error
        retention-days: 30
