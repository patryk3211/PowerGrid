[[dependencies.powergrid]]
modId = "minecraft"
mandatory = true
versionRange = "[${minecraft_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.powergrid]]
modId = "architectury"
mandatory = true
versionRange = "[${architectury_version},)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.powergrid]]
modId = "create"
mandatory = true
versionRange = "${create_forge_version}"
ordering = "AFTER"
side = "BOTH"
