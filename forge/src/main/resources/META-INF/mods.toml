modLoader = "javafml"
loaderVersion = "${forge_version_range}"
issueTrackerURL = "https://github.com/patryk3211/PowerGrid/issues"
license = "Apache-2.0"

[[mods]]
modId = "powergrid"
version = "${version}"
displayName = "Create: Power Grid"
authors = "patryk3211, Da-Negy, rvndm, casvara"
