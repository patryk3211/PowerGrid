architectury.forge()

configurations {
    developmentForge.extendsFrom common
}

dependencies {
    forge "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    modImplementation("com.simibubi.create:create-${minecraft_version}:${create_forge_version}:slim") { transitive false }
    modImplementation("net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_forge_version}")
    modCompileOnly("dev.engine-room.flywheel:flywheel-forge-api-${minecraft_version}:${flywheel_forge_version}")
    modImplementation("com.tterrag.registrate:Registrate:${registrate_forge_version}")

    modImplementation "dev.architectury:architectury-forge:${architectury_api_version}"

    // Just Enough Items
    modCompileOnly "mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}"

    // Roughly Enough Items - Forge
    modCompileOnly "me.shedaniel:RoughlyEnoughItems-api-forge:$rei_version"

    // Create: The Factory Must Grow
    modCompileOnly "maven.modrinth:create-tfmg:1.0.2c"

    // Cold Sweat
    modCompileOnly "curse.maven:cold-sweat-506194:${cold_sweat_cursemaven_fileid}-sources-${cold_sweat_sources_cursemaven_fileid}"

    compileOnly("io.github.llamalad7:mixinextras-common:${mixin_extras_version}")
    annotationProcessor(implementation(include("io.github.llamalad7:mixinextras-forge:${mixin_extras_version}")))

    shadowCommon(project(path: rootProject.path, configuration: "transformProductionForge")) { transitive false }

    forgeRuntimeLibrary "org.ejml:ejml-core:0.44.0"
    forgeRuntimeLibrary "org.ejml:ejml-simple:0.44.0"
    forgeRuntimeLibrary "org.ejml:ejml-ddense:0.44.0"
    forgeRuntimeLibrary "org.ejml:ejml-dsparse:0.44.0"

    modLocalRuntime("dev.engine-room.flywheel:flywheel-forge-${minecraft_version}:${flywheel_forge_version}")
    modLocalRuntime("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")
//    modLocalRuntime("maven.modrinth:create-tfmg:1.0.2c")
//    modLocalRuntime("me.shedaniel:RoughlyEnoughItems-forge:$rei_version")
    modApi("org.valkyrienskies:valkyrienskies-120-forge:${vs2_version}") { transitive = false
        exclude group: 'org.valkyrienskies.core', module: ''
    }
    implementation("org.valkyrienskies.core:api:${vscore_version}") { transitive = false
        exclude group: 'org.joml', module: ''
    }
    implementation("org.valkyrienskies.core:util:${vscore_version}") { transitive = false
        exclude group: 'org.joml', module: ''
    }
    implementation("org.valkyrienskies.core:internal:${vscore_version}") { transitive = false
        exclude group: 'org.joml', module: ''
    }

    forgeRuntimeLibrary("org.valkyrienskies.core:api:${vscore_version}") { transitive = false
        exclude group: 'org.joml', module: ''
    }
    forgeRuntimeLibrary("org.valkyrienskies.core:util:${vscore_version}") { transitive = false
        exclude group: 'org.joml', module: ''
    }

    forgeRuntimeLibrary("maven.modrinth:kotlin-for-forge:${kff_version}")

    forgeRuntimeLibrary include("javax.inject:javax.inject:1") { transitive = false }

    // JOML for Math
    forgeRuntimeLibrary include("org.joml:joml-primitives:1.10.0")

    // Apache Commons Math for Linear Programming
    forgeRuntimeLibrary include("org.apache.commons:commons-math3:3.6.1") { transitive = false }

    // Jackson Binary Dataformat for Object Serialization
    def jacksonVersion = '2.14.0'
    // forked to remove module-info
    forgeRuntimeLibrary include("com.fasterxml.jackson.module:jackson-module-kotlin:$jacksonVersion-rubyfork") { transitive = false }
    forgeRuntimeLibrary include("com.fasterxml.jackson.module:jackson-module-parameter-names:$jacksonVersion") { transitive = false }
    forgeRuntimeLibrary include("com.fasterxml.jackson.dataformat:jackson-dataformat-cbor:$jacksonVersion") { transitive = false }
    forgeRuntimeLibrary include("com.fasterxml.jackson.core:jackson-databind:$jacksonVersion") { transitive = false }
    forgeRuntimeLibrary include("com.fasterxml.jackson.core:jackson-annotations:$jacksonVersion") { transitive = false }
    forgeRuntimeLibrary include("com.fasterxml.jackson.core:jackson-core:$jacksonVersion") { transitive = false }
    forgeRuntimeLibrary include("com.github.Rubydesic:jackson-kotlin-dsl:1.2.0") { transitive = false }

    forgeRuntimeLibrary include("com.networknt:json-schema-validator:1.0.71") { transitive = false }
    forgeRuntimeLibrary include("com.ethlo.time:itu:1.7.0") { transitive = false }
    forgeRuntimeLibrary include("com.github.victools:jsonschema-module-jackson:4.25.0") { transitive = false }
    forgeRuntimeLibrary include("com.github.victools:jsonschema-generator:4.25.0") { transitive = false }
    forgeRuntimeLibrary include("com.fasterxml:classmate:1.5.1") { transitive = false }
    forgeRuntimeLibrary include("com.flipkart.zjsonpatch:zjsonpatch:0.4.11") { transitive = false }
    forgeRuntimeLibrary include("org.apache.commons:commons-collections4:4.3") { transitive = false }

    forgeRuntimeLibrary include("com.google.dagger:dagger:2.43.2") { transitive = false }
}

loom {
    forge {
        mixinConfigs("powergrid.mixins.json", "powergrid.client.mixins.json", "powergrid-forge.mixins.json")
    }

    runs {
        named("client") {
            vmArg("-enableassertions")
            vmArg("-Djava.library.path=" + rootProject.nativeLibDir)
        }

        create("data") {
            data()
            programArgs "--all", "--mod", "powergrid"
            programArgs "--output", file("src/main/generated").absolutePath
            programArgs "--existing", file("../src/main/resources").absolutePath
        }

        configureEach {
            programArg("-mixin.config=create.mixins.json")
            property "-Dmixin.debug.export=true"
            property "-Dmixin.env.remapRefMap=true"
            property "-Dmixin.env.refMapRemappingFile=${projectDir}/build/createSrgToMcp/output.srg"
        }
    }
}

sourceSets.main {
    resources {
        srcDir("src/main/generated")
        exclude("**/.cache/**")
    }
}
