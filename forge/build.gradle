architectury.neoForge {
    platformPackage = "forge"
}

configurations {
    developmentNeoForge.extendsFrom common
}

dependencies {
    neoForge "net.neoforged:neoforge:${neoforge_version}"

    modImplementation("com.simibubi.create:create-${minecraft_version}:${create_forge_version}:slim") { transitive false }
    modImplementation("net.createmod.ponder:ponder-neoforge:${ponder_forge_version}+mc${minecraft_version}")
    modCompileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_forge_version}")
    modImplementation("com.tterrag.registrate:Registrate:${registrate_forge_version}")

    modImplementation "dev.architectury:architectury-neoforge:${architectury_api_version}"

    // Just Enough Items
    modCompileOnly "mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}"

    // Roughly Enough Items - Forge
//    modCompileOnly "me.shedaniel:RoughlyEnoughItems-api-forge:$rei_version"

    // Create: The Factory Must Grow
    modCompileOnly "maven.modrinth:create-tfmg:1.2.0"

    // TIS-3D
    modCompileOnly("maven.modrinth:tis3d-renewed:${tis3d_version}")

    // CC: Tweaked
    modCompileOnly("cc.tweaked:cc-tweaked-${project.minecraft_version}-core-api:${cc_tweaked_version}")
    modCompileOnly("cc.tweaked:cc-tweaked-${project.minecraft_version}-forge-api:${cc_tweaked_version}")
    forgeRuntimeLibrary "cc.tweaked:cobalt:0.9.7"
    modLocalRuntime("cc.tweaked:cc-tweaked-${project.minecraft_version}-forge:${cc_tweaked_version}")

    // Cold Sweat
    modCompileOnly "curse.maven:cold-sweat-506194:${cold_sweat_cursemaven_fileid}-sources-${cold_sweat_sources_cursemaven_fileid}"

    compileOnly("io.github.llamalad7:mixinextras-common:${mixin_extras_version}")
    annotationProcessor(implementation(include("io.github.llamalad7:mixinextras-neoforge:${mixin_extras_version}")))

    shadowCommon(project(path: rootProject.path, configuration: "transformProductionNeoForge")) { transitive false }

    forgeRuntimeLibrary "org.ejml:ejml-core:0.44.0"
    forgeRuntimeLibrary "org.ejml:ejml-simple:0.44.0"
    forgeRuntimeLibrary "org.ejml:ejml-ddense:0.44.0"
    forgeRuntimeLibrary "org.ejml:ejml-dsparse:0.44.0"

    include(modApi("dev.ryanhcode.sable-companion:sable-companion-common-${project.minecraft_version}:${project.sable_companion_version}")) {
        version {
            prefer project.sable_companion_version
        }
    }

    modLocalRuntime("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_forge_version}")
    modLocalRuntime("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")

    modLocalRuntime("dev.ryanhcode.sable:sable-neoforge-${minecraft_version}:${sable_version}")
    modLocalRuntime("dev.eriksonn.aeronautics:aeronautics-neoforge-${minecraft_version}:${aeronautics_version}") {
        exclude group: "cc.tweaked", module: "cc-tweaked-1.21.1-forge"
    }
    modLocalRuntime("dev.simulated_team.simulated:simulated-neoforge-${minecraft_version}:${aeronautics_version}") {
        exclude group: "cc.tweaked", module: "cc-tweaked-1.21.1-forge"
    }

    forgeRuntimeLibrary("io.github.ocelot:glsl-processor:0.2.3")
    forgeRuntimeLibrary("gg.moonflower:molang-compiler:3.1.1.19")
	forgeRuntimeLibrary("io.github.spair:imgui-java-binding:1.88.0")
	forgeRuntimeLibrary("io.github.spair:imgui-java-lwjgl3:1.88.0")

//    modLocalRuntime("maven.modrinth:create-tfmg:1.2.0")
//    modLocalRuntime("me.shedaniel:RoughlyEnoughItems-forge:$rei_version")
//    modLocalRuntime("maven.modrinth:tis3d-renewed:${tis3d_version}")
//    modLocalRuntime("maven.modrinth:markdown-manual-renewed:1.3.1")
}

loom {
    neoForge {
//        mixinConfigs("powergrid.mixins.json", "powergrid.client.mixins.json", "powergrid-forge.mixins.json")
    }

    runs {
        named("client") {
            vmArg("-enableassertions")
            vmArg("-Djava.library.path=" + rootProject.nativeLibDir)
        }

        create("data") {
            data()
            programArgs "--all", "--mod", "powergrid"
            programArgs "--output", file("src/main/generated").absolutePath
            programArgs "--existing", file("../src/main/resources").absolutePath
        }

        configureEach {
//            programArg("-mixin.config=create.mixins.json")
            property "-Dmixin.debug.export=true"
            property "-Dmixin.env.remapRefMap=true"
            property "-Dmixin.env.refMapRemappingFile=${projectDir}/build/createSrgToMcp/output.srg"
        }
    }
}

sourceSets.main {
    resources {
        srcDir("src/main/generated")
        exclude("**/.cache/**")
    }
}
