plugins {
    id 'cpp'
    id 'java'
}

// Beware! Things here might not work in different build environments.

def isAvailable = { String... cmdLine ->
    return providers.exec {
        commandLine cmdLine
    }.getResult().map { result -> result.getExitValue() == 0 }.orElse(false).get()
}

def hasCMake = isAvailable 'cmake', '--version'
def hasNinja = isAvailable 'ninja', '--version'

def jvmHome = Jvm.current().javaHome
def cmakeBuildDir = project.layout.buildDirectory.dir('cmakeBuild').get()
if(hasCMake && hasNinja) {
    def cmakeConf = providers.exec {
        commandLine 'cmake', '-S', "${project.layout.projectDirectory}",
                '-B', "${cmakeBuildDir}",
                '-D', "JVM_INCLUDE=${jvmHome}/include;${jvmHome}/include/linux",
                '-D', 'CMAKE_EXPORT_COMPILE_COMMANDS=true',
                '-D', 'CMAKE_BUILD_TYPE=Release',
                '-G', 'Ninja'
    }
    providers.exec {
        commandLine 'ln', '-s', "${cmakeBuildDir.dir('compile_commands.json')}"
    }
    System.out.println(cmakeConf.standardOutput.getAsText().get())
}

tasks.register('cmakeBuild', Exec) {
    enabled = hasCMake && hasNinja

    commandLine 'cmake', '--build', "${cmakeBuildDir}"
}
