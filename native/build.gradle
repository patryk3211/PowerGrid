plugins {
    id 'cpp'
    id 'java'
}

// Beware! Things here might not work in different build environments.

def isSuccessful = { String... cmdLine ->
    try {
        return providers.exec {
            commandLine cmdLine
        }.getResult().map { result -> result.getExitValue() == 0 }.getOrElse(false)
    } catch(ignored) {
        return false
    }
}

def jvmHome = Jvm.current().javaHome

def configureTask = { String platform, String taskName, String libName ->
    def platformProperty = { String name ->
        return project.property("${platform}.${name}")
    }

    def hasCMake = isSuccessful "${platformProperty('cmakeExecutable')}", '--version'
    def cmakeBuildDir = project.layout.buildDirectory.dir("cmake/${platform}").get()
    def buildAvailable = false
    if(hasCMake) {
        try {
            def args = [ "${platformProperty('cmakeExecutable')}", '-S', "${project.layout.projectDirectory}",
                '-B', "${cmakeBuildDir}",
                '-D', "JVM_INCLUDE=\'${jvmHome}/include;${jvmHome}/include/${platform}\'",
                '-D', 'CMAKE_EXPORT_COMPILE_COMMANDS=true',
                '-D', "CMAKE_BUILD_TYPE=${platformProperty('cmakeBuildType')}",
                '-D', "PG_TRACE=${project.nativeTrace}",
                '-D', "PG_MULTITARGET=${project.multiArch}",
                '-G', "${platformProperty('cmakeGenerator')}" ]
            System.out.println(args);
            def cmakeConf = providers.exec {
                commandLine args
            }
            buildAvailable = cmakeConf.getResult().map { r -> r.exitValue == 0 }.getOrElse(false)
            System.out.println(cmakeConf.standardOutput.getAsText().get())
        } catch(ignored) {

        }
    }

    if(buildAvailable) {
        System.out.println("Native build for platform '${platform}' configured successfully.")
    } else {
        System.out.println("Configuring native build for platform '${platform}' has failed. Task will be skipped.")
    }

    tasks.register(taskName, Exec) {
        enabled = buildAvailable

        commandLine "${platformProperty('cmakeExecutable')}", '--build', "${cmakeBuildDir}"

        inputs.files(
                layout.projectDirectory.dir("src/powergridNative/cpp").getAsFileTree()
        )
        outputs.file(cmakeBuildDir.file(libName))
    }
}

configureTask("linux", "buildLinux", "libpowergridNative.so")
configureTask("windows", "buildWindows", "libpowergridNative.dll")
